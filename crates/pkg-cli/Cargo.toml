[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
ar = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }

[[test]]
name = "cli_smoke"
path = "../../tests/cli_smoke.rs"

[[test]]
name = "gate_m1_a_parser"
path = "../../tests/gate_m1_a_parser.rs"

[[test]]
name = "gate_m1_b_store"
path = "../../tests/gate_m1_b_store.rs"

[[test]]
name = "gate_m1_c_transaction"
path = "../../tests/gate_m1_c_transaction.rs"

[[test]]
