name = "pkg-atlantic-sh"
main = "src/index.js"
compatibility_date = "2024-09-01"

# To associate with your custom domain:
# Option A: In Cloudflare Dashboard -> Workers & Pages -> pkg -> Settings -> Domains & Routes -> Add Custom Domain: pkg.atlantic.sh
# Option B: Uncomment the routes block below if your DNS zone 'atlantic.sh' is managed on Cloudflare:
# routes = [
#   { pattern = "pkg.atlantic.sh/*", zone_name = "atlantic.sh" }
# ]

[vars]
GITHUB_REPO = "brasga-a/pkg"
DEFAULT_BRANCH = "main"
CACHE_TTL = "300"
