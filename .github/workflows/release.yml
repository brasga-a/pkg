name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --bin pkg

      - name: Package artifacts
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cd target/release
          
          # 1. Generic Linux x86_64 package
          tar -czf pkg-linux-x86_64.tar.gz pkg
          sha256sum pkg-linux-x86_64.tar.gz > pkg-linux-x86_64.tar.gz.sha256

          # 2. Versioned target-triple package
          tar -czf "pkg-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" pkg
          sha256sum "pkg-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" > "pkg-${VERSION}-x86_64-unknown-linux-gnu.tar.gz.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/release/pkg-linux-x86_64.tar.gz
            target/release/pkg-linux-x86_64.tar.gz.sha256
            target/release/pkg-*-x86_64-unknown-linux-gnu.tar.gz
            target/release/pkg-*-x86_64-unknown-linux-gnu.tar.gz.sha256
